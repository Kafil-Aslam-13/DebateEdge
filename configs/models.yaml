# Model routing config - used by LLM GATEWAY

# LLM GATEWAY Model Configuration
# Used by LLMGateway to build the LLM Router

#TASK Routing = which task uses which routing
task_routing:
  classification: "fast"
  scoring: "fast"
  debate: "powerful"
  fallacy: "powerful"
  summary: "fast"
  explanation: "fast"

# Model Pool Litellm Router Model_list format
models:
  - model_name: "fast"
    litellm_params:
      model: "groq/openai/gpt-oss-120b"
      api_key: "os.environ/GROQ_API_KEY"
    model_info:
      max_tokens: 512
      temperature: 0.2

  - model_name: "fast"
    litellm_params:
      model: "groq/qwen/qwen3.6-27b"
      api_key: "os.environ/GROQ_API_KEY"
    model_info:
      max_tokens: 512
      temperature: 0.2
  
  - model_name: "powerful"
    litellm_params:
      model: "groq/qwen/qwen3.6-27b"
      api_key: "os.environ/GROQ_API_KEY"
    model_info:
      max_tokens: 512
      temperature: 0.7

  - model_name: "powerful"
    litellm_params:
      model: "groq/openai/gpt-oss-120b"
      api_key: "os.environ/GROQ_API_KEY"
    model_info:
      max_tokens: 512
      temperature: 0.7

#  fallback chain - if fast fails try powerful , vice versa
fallbacks:
  - fast: ["powerful"]
  - powerful: ["fast"]

#  Gateway Behavior
gateway:
  num_retries: 3
  retry_after: 5
  cache_enabled: true
  cache_ttl: 3600 # seconds  - 1 hour
  rate_limit_rpm: 60 # requests per min per session

    
    
  
