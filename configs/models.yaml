# Model routing config - used by LLM GATEWAY

models:
  fast:
    provider: groq
    model: llama-3.1-8b-instant
    max_tokens: 512
    temperature: 0.5
    use_for:
      - simple_response
      - classification
      - scoring
  
  powerful:
    provider: groq
    model: llama-3.3-70b-versatile
    max_tokens: 2048
    temperature: 0.7
    use_for:
      - debate_argument
      - fallacy_detection
      - coaching_report
      - complex_analysis

  balanced:
    provider: groq
    model: llama-3.1-70b-versatile
    max_tokens: 1024
    temperature: 0.6
    use_for:
      - general
      - explanation


fallbacks:
  - "groq/llama-3.3-70b-versatile"
  - "groq/llama-3.1-70b-versatile"
  - "groq/llama-3.1-8b-instant"