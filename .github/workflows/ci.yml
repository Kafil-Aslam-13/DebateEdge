name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  # ── Backend: Python tests ──────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — critical files
        run: |
          python -m py_compile src/core/config.py
          python -m py_compile src/core/constants.py
          python -m py_compile src/core/exceptions.py
          python -m py_compile src/core/logger.py
          python -m py_compile src/graphs/state.py
          python -m py_compile src/graphs/debate_graph.py
          python -m py_compile src/services/debate_service.py
          python -m py_compile app/api/main.py
          python -m py_compile app/api/routes/debate.py
          echo "Backend syntax OK"

      - name: Run tests
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov=app \
            --cov-report=term-missing

  # ── Frontend: Node build check ─────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend_react/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend_react
        run: npm install

      - name: Build frontend
        working-directory: app/frontend_react
        env:
          VITE_BACKEND_URL: http://localhost:8000
        run: |
          npm run build
          echo "Frontend build OK — dist/ created"

      - name: Check dist output exists
        working-directory: app/frontend_react
        run: |
          ls dist/
          test -f dist/index.html && echo "index.html exists"