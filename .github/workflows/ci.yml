name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile src/core/config.py
          python -m py_compile src/core/constants.py
          python -m py_compile src/graphs/state.py
          python -m py_compile src/graphs/debate_graph.py
          python -m py_compile src/services/debate_service.py
          python -m py_compile app/api/main.py
          python -m py_compile app/api/routes/debate.py
          echo "Backend syntax OK"

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov=app \
            --cov-report=term-missing

  # ── Frontend build check ───────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend_react/package.json

      - name: Install frontend deps
        run: |
          cd app/frontend_react
          npm install

      - name: Build frontend
        env:
          VITE_BACKEND_URL: http://localhost:8000
        run: |
          cd app/frontend_react
          npm run build
          echo "Frontend build OK"